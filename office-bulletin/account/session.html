<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会话确认 · 青禾实业</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <div class="logo">青禾实业</div>
      <div><a href="../index.html">返回资讯首页</a></div>
    </div>
  </div>
  <div class="wrap">
    <div class="paper" style="max-width: 520px; margin: 36px auto;">
      <div class="kicker">账号安全</div>
      <h1>会话确认</h1>
      <p>为保障门户访问安全，请确认当前会话后继续浏览通知。</p>
      <form id="f">
        <div class="field">
          <label for="sid">会话编号</label>
          <input id="sid" name="sid" autocomplete="off">
        </div>
        <button class="btn" type="submit">确认并继续</button>
      </form>
      <p id="msg" class="meta"></p>
    </div>
    <div class="foot">青禾实业办公资讯</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var sid = params.get("sid") || params.get("code") || "";
      document.getElementById("sid").value = sid;
      document.getElementById("f").addEventListener("submit", function (e) {
        e.preventDefault();
        var value = document.getElementById("sid").value.trim();
        document.getElementById("msg").textContent = "会话已刷新，可以返回继续阅读通知。";
        try {
          var key = "qh-session-log";
          var list = JSON.parse(localStorage.getItem(key) || "[]");
          list.push({ sid: value, at: new Date().toISOString() });
          localStorage.setItem(key, JSON.stringify(list));
        } catch (err) {}
      });
    })();
  </script>
</body>
</html>
